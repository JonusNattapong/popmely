[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popmely"
version = "5.0.0"
description = "High-performance Model Context Protocol (MCP) Server for MetaTrader 5 (MT5) AI Trading & Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "JonusNattapong" }
]
keywords = ["mcp", "model-context-protocol", "metatrader5", "mt5", "trading-bot", "smc", "ai-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.0.0",
    "MetaTrader5>=5.0.5200",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
popmely = "popmely.server:main"
mcp-server-popmely = "popmely.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/popmely"]
